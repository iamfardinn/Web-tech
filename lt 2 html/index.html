<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Online Admission Form</title>
</head>
<body>
    <h1>University Online Admission Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">
        <!-- Personal Information Section -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="firstName">First Name:</label><br>
            <input type="text" id="firstName" name="firstName" required maxlength="30"><br><br>

            <label for="lastName">Last Name:</label><br>
            <input type="text" id="lastName" name="lastName" required maxlength="30"><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required><br><br>

            <span>Gender:</span><br>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="text" id="phone" name="phone" maxlength="15"><br><br>

            <label for="address">Address:</label><br>
            <input type="text" id="address" name="address" maxlength="100"><br><br>
        </fieldset>

        <br>

        <!-- Academic Information Section -->
        <fieldset>
            <legend>Academic Information</legend>

            <label for="hscInstitution">Last Institution Attended:</label><br>
            <input type="text" id="hscInstitution" name="hscInstitution" required maxlength="60"><br><br>

            <label for="hscResult">HSC / Equivalent Result (GPA):</label><br>
            <input type="text" id="hscResult" name="hscResult" required maxlength="5"><br><br>

            <label for="sscResult">SSC / Equivalent Result (GPA):</label><br>
            <input type="text" id="sscResult" name="sscResult" maxlength="5"><br><br>
